plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '6.0.+'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = '2.0.0.1'
group = 'com.skytekx.elementarystaffs'
archivesBaseName = 'elementary-staffs-1.20.1'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// The GameTests live in their own source set. The game test server loads
// them next to the mod, but they never end up in the mod jar.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

minecraft {
    mappings channel: 'parchment', version: '2023.09.03-1.20.1'

    runs {
        server {
            workingDirectory project.file('run/server')
            property 'forge.logging.console.level', 'info'
            args '--nogui'
            mods {
                elementary_staffs {
                    source sourceSets.main
                }
            }
        }

        gameTestServer {
            workingDirectory project.file('run/gametest')
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', 'elementary_staffs'
            mods {
                elementary_staffs {
                    source sourceSets.main
                    source sourceSets.gametest
                }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.6'
}

jar {
    // The MIT license asks that its text and the copyright notice travel with every copy.
    from(files('LICENSE', 'NOTICE')) {
        rename { "${it}_elementary_staffs" }
    }
    manifest {
        attributes([
                "Specification-Title"     : "elementary_staffs",
                "Specification-Vendor"    : "skytekx",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "skytekx",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
